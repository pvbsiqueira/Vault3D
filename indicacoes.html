<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05080c">
  <title>Vault3D · Indicações</title>
  <meta name="description" content="Filamentos, bicos, placas e acessórios que a gente usa e indica para sua impressora 3D.">
  <link rel="icon" type="image/png" href="build/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="indicacoes.css">
</head>
<body>
  <div class="page">
    <header class="top inner">
      <a href="/" class="brand"><img src="build/icon.png" alt="" width="32" height="32"><span>Vault<b>3D</b></span></a>
      <a href="/" class="btn btn-ghost btn-sm">Conhecer o app</a>
    </header>

    <main class="stage inner">
      <div class="intro">
        <h1>Indicações para sua <span class="grad">impressora 3D</span></h1>
        <p class="lead">Filamentos, peças e acessórios que valem a pena. Os links são de afiliado: você paga o mesmo preço e uma parte ajuda a manter o Vault3D grátis.</p>
      </div>

      <section class="produtos" id="produtos" hidden aria-label="Produtos em destaque">
        <div class="sec-head">
          <h2>Em destaque</h2>
          <div class="arrows">
            <button type="button" class="arrow" data-dir="-1" aria-label="Anteriores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
            <button type="button" class="arrow" data-dir="1" aria-label="Próximos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
        </div>
        <ul class="trilho" id="trilho"></ul>
      </section>

      <section aria-label="Categorias">
        <ul class="categorias" id="categorias"></ul>
      </section>
    </main>

    <footer class="rodape inner">Como associado da Amazon, o Vault3D recebe por compras qualificadas.</footer>
  </div>

  <script type="module" src="indicacoes.js"></script>
</body>
</html>
