name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'main.js'
      - 'build/**'
      - '.github/workflows/build-release.yml'

jobs:
  build:
    name: Build Windows Installer (NSIS)
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build & Publish Release to GitHub
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win -- --publish always

      # Em PRs só compila o instalador, para pegar erros antes do release.
      - name: Build Installer (no publish)
        if: github.event_name == 'pull_request'
        run: npm run dist:win -- --publish never
